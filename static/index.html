    .batch-overview{display:grid;grid-template-columns:repeat(7,minmax(105px,1fr));gap:10px;margin:0 0 16px}.batch-stat{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:14px 12px;min-height:78px}.batch-stat small{display:block;color:#64748b;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.04em}.batch-stat b{display:block;margin-top:7px;font-size:21px;letter-spacing:-.02em}.batch-stat.accent{background:linear-gradient(135deg,#eff6ff,#f5f3ff);border-color:#c7d2fe}.batch-progress-wrap{margin:0 0 16px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:14px}.batch-progress-head{display:flex;justify-content:space-between;gap:12px;font-size:12px;font-weight:850;margin-bottom:8px}.batch-progress-track{height:10px;background:#e2e8f0;border-radius:999px;overflow:hidden}.batch-progress-bar{height:100%;width:0;background:linear-gradient(135deg,#2563eb,#7c3aed);transition:width .35s}.batch-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px}.batch-note{font-size:12px;color:#64748b}.batch-note b{color:#334155}.batch-complete{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;border-radius:12px;padding:9px 12px;font-size:12px;font-weight:850}.batch-estimate{white-space:nowrap}

.qa-filter-count{font-size:12px;color:#64748b;font-weight:800;margin-left:auto}.qa-filter-tags{display:flex;gap:7px;flex-wrap:wrap;width:100%}.qa-filter-tag{border:1px solid #dbe3ef;background:#fff;color:#475569;border-radius:999px;padding:7px 11px;font-size:11px;font-weight:900}.qa-filter-tag:hover{border-color:#93c5fd;color:#1d4ed8}.qa-filter-tag.active{background:#eff6ff;border-color:#93c5fd;color:#1d4ed8}.qa-filter-tag.critical.active{background:#fee2e2;border-color:#fecaca;color:#991b1b}.qa-filter-tag.major.active{background:#ffedd5;border-color:#fed7aa;color:#9a3412}.qa-filter-tag.minor.active{background:#fef9c3;border-color:#fde68a;color:#854d0e}.qa-filter-tag.pass.active{background:#dcfce7;border-color:#bbf7d0;color:#166534}

<body>
<div id="root"></div><div id="toast" class="toast hidden"></div>
<script>
const state={user:null,hasUsers:false,loginMode:'user',mode:'pdf',pairs:[],jobs:{},currentRun:null,history:[],adminTab:'dashboard',activeRunReturn:null};
const $=id=>document.getElementById(id);const root=$('root');
async function api(url,opt={}){const r=await fetch(url,opt);const raw=await r.text();let data=null;try{data=raw?JSON.parse(raw):{}}catch(e){data={error:raw||('Request failed: '+r.status)}}if(!r.ok)throw new Error(data.error||'Request failed: '+r.status);return data}
function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2500)}
function chip(v){return `<span class="chip ${esc(v||'')}">${esc(v||'—')}</span>`}
function isAdmin(){return state.user&&(state.user.role==='admin'||Number(state.user.is_admin)===1)}
function strong(p,u=''){return p.length>=10&&/[a-z]/.test(p)&&/[A-Z]/.test(p)&&/\d/.test(p)&&/[^A-Za-z0-9]/.test(p)&&!p.includes(' ')&&(!u||!p.toLowerCase().includes(u.toLowerCase()))}
function authLayout(body){root.innerHTML=`<div class="auth-shell"><div class="auth-card"><section class="auth-visual"><div><span class="brand-badge" style="background:rgba(255,255,255,.14);color:white;border-color:rgba(255,255,255,.25)">QA VALIDATION PORTAL</span><h1>Source to HTML quality control</h1><p>Separate access for users and the single system administrator.</p></div><div class="auth-visual-grid"><div class="auth-info"><b>User access</b>Run PDF/RTF to HTML QA and view personal history.</div><div class="auth-info"><b>Admin access</b>Monitor users, invites, runs, and failed processes.</div><div class="auth-info"><b>Run tracking</b>Prepared, running, completed, failed, and interrupted status.</div><div class="auth-info"><b>Reports</b>Batch reports, file reports, audits, and history.</div></div></section><section class="auth-form">${body}</section></div></div>`}
async function boot(){const path=location.pathname;if(path.startsWith('/accept-invite/')) return showAcceptInvite(path.split('/').pop());if(path.startsWith('/reset-password/')) return showResetPassword(path.split('/').pop());try{const me=await api('/api/me');state.user=me.user;state.hasUsers=!!me.has_users;if(state.user) return showApp();return showLogin()}catch(e){showLogin(e.message)}}
function showSetupAdmin(err=''){authLayout(`<h1>Create Admin Account</h1><p>Create the first administrator for this QA portal. After this, users are added through admin invites.</p><div class="field"><label>Company Email</label><input id="email" class="input" placeholder="admin@company.com"></div><div class="field"><label>Username</label><input id="username" class="input" placeholder="admin"></div><div class="field"><label>Password</label><input id="password" type="password" class="input" placeholder="Create strong password"></div><div class="rules">Use at least 10 characters with uppercase, lowercase, number, and symbol.</div><button class="primary" style="width:100%" onclick="setupAdmin()">Create Admin</button>${err?`<div class="error">${esc(err)}</div>`:''}`)}
async function setupAdmin(){const email=$('email').value.trim().toLowerCase(),username=$('username').value.trim().toLowerCase(),password=$('password').value;if(!strong(password,username))return showSetupAdmin('Use a stronger password.');try{const r=await api('/api/setup-admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,username,password})});state.user=r.user;showApp()}catch(e){showSetupAdmin(e.message)}}
function showLogin(err='', keepLogin=''){
const mode=state.loginMode||'user';
const title=mode==='admin'?'Admin Login':'User Login';
const label=mode==='admin'?'Admin Email or Username':'Email or Username';

function showSelectedFiles(inputId,outputId){const input=$(inputId),out=$(outputId);if(!input||!out)return;const files=[...input.files];if(!files.length){out.textContent='No files selected';out.classList.remove('has-files');return}out.innerHTML=files.map(f=>`<div>✓ ${esc(f.name)}</div>`).join('');out.classList.add('has-files')}
async function preparePairs(){
 const sourceInput=$('sourceFiles'),targetInput=$('targetFiles');
 const sourceFiles=[...(sourceInput?.files||[])],targetFiles=[...(targetInput?.files||[])];
 if(!sourceFiles.length||!targetFiles.length)return toast('Choose files for both Source and Target.');
 // Do not let a stale tab/mode state misclassify a package. If the selected
 // source files are explicit RTF/PDF files, use their real extension. ZIPs are
 // resolved again by the server from their extracted contents.
 const explicitSourceExts=new Set(sourceFiles.map(f=>{const n=f.name.toLowerCase();return n.endsWith('.rtf')?'rtf':n.endsWith('.pdf')?'pdf':null}).filter(Boolean));
 if(state.mode!=='pdf_word'&&explicitSourceExts.size===1) state.mode=[...explicitSourceExts][0];
 // Every upload is a brand-new validation run, even if the exact same files were uploaded before.
 state.pairs=[]; state.jobs={}; state.currentRun=null; state.activeRunReturn=null;
 const fd=new FormData();
 fd.append('source_type',state.mode);
 fd.append('upload_instance_id',crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random());
 [...sourceFiles,...targetFiles].forEach(f=>{fd.append('files',f);fd.append('relpaths',f.webkitRelativePath||f.name)});
 try{
   const r=await api('/upload',{method:'POST',body:fd});
   // The backend inspects ZIP contents and is authoritative about the source type.
   if(['pdf','rtf'].includes(r.source_type)) state.mode=r.source_type;
   state.pairs=r.pairs||[]; state.currentRun=r.run_id||r.batch_id;
   renderPairs(r);
 }catch(e){toast(e.message)}
}
function renderPairs(r){
 const modeLabel=state.mode==='pdf_word'?'PDF ↔ WORD':state.mode==='rtf'?'RTF ↔ HTML':'PDF ↔ HTML';
 state.unmatchedDetails=r.unmatched_details||[];
 state.uploadedFileCount=(state.pairs.length*2)+state.unmatchedDetails.length;
 const unmatched=state.unmatchedDetails;
 const unmatchedBlock=unmatched.length?`<div class="unmatched-box"><div class="unmatched-head"><b>Unmatched files (${unmatched.length})</b><span>Exact source/target filenames are shown below.</span></div><table class="unmatched-table"><thead><tr><th>Source file</th><th>Target file</th><th>Why unmatched</th></tr></thead><tbody>${unmatched.map(x=>`<tr><td>${x.side==='Source'?`<b>${esc(x.filename||'')}</b>`:'—'}</td><td>${x.side==='Target'?`<b>${esc(x.filename||'')}</b>`:'—'}</td><td>${esc(x.reason||'No corresponding file found')}</td></tr>`).join('')}</tbody></table></div>`:'';
 $('runArea').innerHTML=`<div class="card prepared-card"><div class="prepared-header"><div><h2>Prepared Pairs · ${modeLabel}</h2><p class="hint">Run ID: ${esc(state.currentRun)} · ${state.pairs.length} matched pair${state.pairs.length===1?'':'s'}${unmatched.length?` · ${unmatched.length} unmatched`:''}</p></div></div>${unmatchedBlock}<div class="actions" style="margin:14px 0 12px"><button class="primary" onclick="runAll()">Run QA on All Pairs</button></div><table><thead><tr><th>No</th><th>Source</th><th>Target</th><th>Status</th><th>Progress</th><th>Severity</th><th>Errors</th><th>Actions</th></tr></thead><tbody>${state.pairs.map((p,i)=>`<tr id="row${i}"><td>${i+1}</td><td>${esc(p.source_name||p.pdf_name)}</td><td>${esc(p.target_name||p.html_name)}</td><td>${chip(p.status||'queued')}</td><td><div class="progress"><div class="bar"></div></div></td><td>${p.file_severity?chip(p.file_severity):'—'}</td><td>${p.issue_count??'—'}</td><td>${p.status==='done'?`<button class="linkbtn" onclick='openReport(${JSON.stringify(p).replace(/'/g,"&#39;")})'>Open Report</button>`:''}</td></tr>`).join('')}</tbody></table></div>`;
 state.pairs.forEach((p,i)=>{if(p.status==='done')setRow(i,'done',100,p,p.error_message||'',p.job_id||'');else if(p.status==='running')setRow(i,'running',0,null,'',p.job_id||'');});
}
function batchModeLabel(){return state.mode==='pdf_word'?'PDF ↔ WORD':state.mode==='rtf'?'RTF ↔ HTML':'PDF ↔ HTML'}
function formatDuration(sec){if(!isFinite(sec)||sec<0)return 'Estimating…';sec=Math.max(0,Math.round(sec));if(sec<60)return `${sec}s`;const m=Math.floor(sec/60),s=sec%60;if(m<60)return `${m}m ${s}s`;const h=Math.floor(m/60),mm=m%60;return `${h}h ${mm}m`}
function completedCount(){return state.pairs.filter(p=>p.status==='done'||p.status==='error'||p.status==='interrupted').length}
function passedCount(){return state.pairs.filter(p=>p.status==='done'&&Number(p.issue_count||0)===0).length}
function failedCount(){return state.pairs.filter(p=>p.status==='done'&&Number(p.issue_count||0)>0||p.status==='error'||p.status==='interrupted').length}
function totalErrorCount(){return state.pairs.reduce((n,p)=>n+Number(p.issue_count||0),0)}
function averageCompletedSeconds(){
 const durations=state.pairs.map(p=>{if(p._durationSec&&p._durationSec>0)return p._durationSec;if(!p.started_at||!p.finished_at)return null;const a=Date.parse(p.started_at),b=Date.parse(p.finished_at);return isFinite(a)&&isFinite(b)&&b>=a?(b-a)/1000:null}).filter(x=>x!==null&&x>0);
 if(durations.length)return durations.reduce((a,b)=>a+b,0)/durations.length;
 const active=state.pairs.find(p=>p.status==='running'&&p._startedMs);
 if(active&&active._progress>0){const elapsed=(Date.now()-active._startedMs)/1000;return elapsed/(active._progress/100)}
 return null;
}
function estimatedRemainingSeconds(){
 const remaining=state.pairs.filter(p=>!['done','error','interrupted'].includes(p.status)).length;
 if(!remaining)return 0;
 const avg=averageCompletedSeconds();
 if(!avg)return NaN;
 const active=state.pairs.find(p=>p.status==='running'&&p._startedMs);
 let currentRemaining=0;
 if(active&&active._progress>0){const elapsed=(Date.now()-active._startedMs)/1000;currentRemaining=Math.max(0,avg-elapsed)}
 else if(active)currentRemaining=avg;
 const queued=Math.max(0,remaining-(active?1:0));
 return currentRemaining+(queued*avg);
}
function updateBatchDashboard(){
 const done=completedCount(),total=state.pairs.length,progress=total?Math.round(done/total*100):100;
 const el=$('batchOverview');if(!el)return;
 const cards=[['Total Files',state.uploadedFileCount||total*2],['Matched Pairs',total],['Unmatched Files',(state.unmatchedDetails||[]).length],['Total Errors',totalErrorCount()],['Passed Files',passedCount()],['Failed Files',failedCount()],['Estimated Time',formatDuration(estimatedRemainingSeconds())]];
 el.innerHTML=cards.map((x,i)=>`<div class="batch-stat ${i===6?'accent':''}"><small>${x[0]}</small><b>${esc(x[1])}</b></div>`).join('');
 const bar=$('batchProgressBar'),label=$('batchProgressLabel'),time=$('batchProgressTime');if(bar)bar.style.width=progress+'%';if(label)label.textContent=`${done} of ${total} matched pairs completed · ${progress}%`;if(time)time.textContent=done===total?'Completed':`Estimated remaining: ${formatDuration(estimatedRemainingSeconds())}`;
 const dl=$('batchDl');const allDone=total>0&&done===total;if(dl){dl.classList.toggle('hidden',!allDone);dl.setAttribute('aria-disabled',String(!allDone));}
 const note=$('batchStatusNote');if(note){note.innerHTML=allDone?`<span class="batch-complete">All matched files have finished QA.</span>`:`<span><b>QA is running.</b> The estimate updates as each file finishes.</span>`}
}
function issueTagsForPair(p){
 const tags=new Set();
 const issues=Array.isArray(p.issues)?p.issues:[];
 const add=(t)=>{if(t)tags.add(t)};
 for(const er of issues){
   const sev=String(er.severity||'').toLowerCase();
   if(sev==='critical')add('critical'); else if(sev==='major')add('major'); else if(sev==='minor')add('minor');
   const text=String([er.category,er.area,er.message,er.expected,er.actual].filter(Boolean).join(' ')).toLowerCase();
   if(/\bb\s*tag\b|<b>|bold|strong/.test(text))add('b-tags');
   if(/structure|tag attribute|tag nesting|style|title|list|bullet|semantic/.test(text))add('structure');
   if(/context|text mapping|missing text|extra text|changed text|paragraph/.test(text))add('context');
   if(/image|picture|broken image/.test(text))add('images');
   if(/missing|extra/.test(text))add('missing-extra');
 }
 if(p.status==='done' && !issues.length) add('passed');
 if(p.status==='error'||p.status==='interrupted')add('failed');
 return [...tags];
}
function pairMatchesFilter(p,query,filter){
 const hay=String([p.source_name,p.target_name,p.html_name,p.pdf_name].filter(Boolean).join(' ')).toLowerCase();
 if(query && !hay.includes(query.toLowerCase()))return false;
 if(filter==='all')return true;
 return issueTagsForPair(p).includes(filter);
}
function applyQaFilters(){
 const query=($('qaFileSearch')?.value||'').trim();const filter=state.qaFilter||'all';let visible=0;
 state.pairs.forEach((p,i)=>{const tr=$('row'+i);if(!tr)return;const show=pairMatchesFilter(p,query,filter);tr.classList.toggle('batch-row-hidden',!show);if(show)visible++;});
 const count=$('qaFilterCount');if(count)count.textContent=`Showing ${visible} of ${state.pairs.length} files`;
 document.querySelectorAll('.qa-filter-tag').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));
}

 const unmatched=state.unmatchedDetails||[];

 $('runArea').innerHTML=`<div class="card"><div class="prepared-header"><div><h2>QA Analysis · ${modeLabel}</h2><p class="hint">Run ID: ${esc(state.currentRun)} · Uploaded files: ${state.uploadedFileCount||state.pairs.length*2+unmatched.length} · ${unmatched.length} unmatched</p></div><button class="secondary" onclick="returnToValidationWorkspace()">← Back to Validation</button></div>${unmatchedBlock}<div id="batchOverview" class="batch-overview"></div><div class="batch-progress-wrap"><div class="batch-progress-head"><span id="batchProgressLabel">0 of ${state.pairs.length} matched pairs completed · 0%</span><span id="batchProgressTime" class="batch-estimate">Updating…</span></div><div class="batch-progress-track"><div id="batchProgressBar" class="batch-progress-bar"></div></div></div><div class="batch-actions"><div id="batchStatusNote" class="batch-note"><span><b>QA is starting.</b></span></div><a class="linkbtn hidden" id="batchDl" href="/download-batch/${encodeURIComponent(state.currentRun)}">Download Batch Excel</a></div><div class="qa-filter-bar"><input id="qaFileSearch" class="qa-search" placeholder="Search source or target file name…" oninput="applyQaFilters()"><span id="qaFilterCount" class="qa-filter-count">Showing ${state.pairs.length} of ${state.pairs.length} files</span><div class="qa-filter-tags">${filters.map(([v,l])=>`<button type="button" class="qa-filter-tag ${v==='all'?'active':''} ${v}" data-filter="${v}" onclick="setQaFilter('${v}')">${l}</button>`).join('')}</div></div><table><thead><tr><th>No</th><th>Source</th><th>Target</th><th>Status</th><th>Progress</th><th>Severity</th><th>Errors</th><th>Actions</th></tr></thead><tbody>${state.pairs.map((p,i)=>`<tr id="row${i}"><td>${i+1}</td><td>${esc(p.source_name||p.pdf_name)}</td><td>${esc(p.target_name||p.html_name)}</td><td>${chip(p.status||'queued')}</td><td><div class="progress"><div class="bar"></div></div></td><td>${p.file_severity?chip(p.file_severity):'—'}</td><td>${p.issue_count??0}</td><td>${p.status==='done'?`<button class="linkbtn" onclick='openReport(${JSON.stringify({...p,run_id:p.run_id||state.currentRun}).replace(/'/g,"&#39;")})'>Open Report</button>`:'—'}</td></tr>`).join('')}</tbody></table></div>`;
 state.pairs.forEach((p,i)=>{if(p.status==='done')setRow(i,'done',100,p,p.error_message||'',p.job_id||'');else if(p.status==='running')setRow(i,'running',p._progress||0,null,'',p.job_id||'');});

function returnToValidationWorkspace(){renderUserContent(state.mode)}
async function runAll(){
 renderBatchRunPage();
 for(let i=0;i<state.pairs.length;i++){
   const status=state.pairs[i].status||'queued';
   if(status==='done'||status==='error'||status==='interrupted')continue;
   if(status==='running'&&state.pairs[i].job_id){await pollJob(i,state.pairs[i].job_id);continue;}
   await runOne(i);
 }
 updateBatchDashboard();
}
async function runOne(i){
 const p=state.pairs[i];p._startedMs=Date.now();p._progress=0;setRow(i,'running',0);
 try{
   const r=await api('/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...p,batch_id:state.currentRun,file_no:i+1})});
   state.pairs[i].job_id=r.job_id;state.pairs[i].status='running';await pollJob(i,r.job_id);
 }catch(e){state.pairs[i].status='error';setRow(i,'error',0,null,e.message);updateBatchDashboard();}
}
async function pollJob(i,jobId){
 while(true){
   await new Promise(res=>setTimeout(res,700));
   try{let j=await api('/status/'+jobId);state.pairs[i]._progress=Number(j.progress||0);setRow(i,j.status,j.progress,j.result,j.error,jobId);state.pairs[i].status=j.status;state.pairs[i].job_id=jobId;updateBatchDashboard();if(j.status==='done'||j.status==='error')break;}
   catch(e){break;}
 }
}
function setRow(i,status,progress=0,result=null,error='',jobId=''){
 const tr=$('row'+i);if(!tr)return;
 const cells=tr.children;cells[3].innerHTML=chip(status);
 const progressCell=cells[4];const progressBar=progressCell?.querySelector?.('.bar');if(progressBar)progressBar.style.width=(progress||0)+'%';
 if(result){cells[5].innerHTML=chip(result.file_severity||'Passed');cells[6].textContent=result.issue_count??0;cells[7].innerHTML=`<div class="actions"><button class="linkbtn" onclick='openReport(${JSON.stringify({...result,run_id:result.run_id||state.currentRun}).replace(/'/g,"&#39;")})'>Open Report</button><a class="linkbtn" href="/download/${jobId}" ${jobId?'':'style="display:none"'}>Download Excel</a></div>`;state.pairs[i]={...state.pairs[i],...result,status:'done',job_id:jobId||state.pairs[i].job_id,_finishedMs:Date.now(),_durationSec:state.pairs[i]._startedMs?Math.max(0,(Date.now()-state.pairs[i]._startedMs)/1000):null};}
 else if(error){cells[7].innerHTML=`<span class="chip error">${esc(error.slice(0,80))}</span>`;}
 updateBatchDashboard();applyQaFilters();
}
async function restoreRun(runId){
 try{
  const r=await api('/api/history/'+encodeURIComponent(runId));
  state.currentRun=runId;
  state.mode=['pdf','rtf','pdf_word'].includes(r.run.source_type)?r.run.source_type:'pdf';
  state.unmatchedDetails=r.unmatched_details||[];
  state.pairs=(r.files||[]).map(f=>({...f,target_name:f.target_name||f.html_name,html_name:f.html_name,run_id:runId,file_pair_db_id:f.id,status:f.status||'queued',job_id:f.job_id||'',file_severity:f.file_severity||'',issue_count:Number(f.issue_count||0),critical_count:Number(f.critical_count||0),major_count:Number(f.major_count||0),minor_count:Number(f.minor_count||0),issues:Array.isArray(f.issues)?f.issues:[],started_at:f.started_at||'',finished_at:f.finished_at||''}));
  state.uploadedFileCount=Number(r.run.uploaded_file_count||0)||state.pairs.length*2+state.unmatchedDetails.length;
  state.activeRunReturn={runId};
  // Rebuild the normal user dashboard shell, including the PDF/HTML, RTF/HTML and PDF/WORD tabs.
  root.innerHTML=`<div class="app">${topbar()}<main class="main"><div id="content"></div></main></div>`;
  const c=$('content');
  c.innerHTML=`<div class="page-head"><div><div class="page-kicker">QA Workspace</div><h1>${batchModeLabel()} Validation</h1><p>Continue or review this existing QA run. Your uploaded files and results are preserved.</p></div></div>${userTabs(state.mode)}<div id="runArea"></div>`;
  renderBatchRunPage();
  state.pairs.forEach((p,i)=>{if(p.status==='running'&&p.job_id)pollJob(i,p.job_id);});
 }catch(e){toast(e.message)}
}
async function openReport(result){
 state.activeRunReturn={runId:result.run_id||state.currentRun};
 const initialIssues=Array.isArray(result.issues)?result.issues:[];
 root.innerHTML=`<div class="app">${topbar()}<main class="main report-page"><div class="report-title"><div><button class="secondary" onclick="returnToRun()">← Back to QA Run</button><h1>File Report</h1><p>${esc(result.source_name||result.pdf_name)} → ${esc(result.target_name||result.html_name)}</p></div><a class="linkbtn" href="/download-file/${result.file_pair_db_id}">Download Excel</a></div><div class="summary-strip"><div class="mini"><small>Status</small><b>${esc(result.status||'')}</b></div><div class="mini"><small>Severity</small><b>${esc(result.file_severity||'')}</b></div><div class="mini"><small>Errors</small><b>${esc(result.issue_count??initialIssues.length)}</b></div><div class="mini"><small>Critical</small><b>${esc(result.critical_count??0)}</b></div><div class="mini"><small>Major</small><b>${esc(result.major_count??0)}</b></div><div class="mini"><small>Minor</small><b>${esc(result.minor_count??0)}</b></div></div><div id="fileReportBody" class="card"><p class="hint">Loading QA issues…</p></div></main></div>`;
 const renderIssues=(issues)=>{
   const body=$('fileReportBody');
   if(!body)return;
   body.innerHTML=`<div class="table-scroll"><table class="report-table"><thead><tr><th>No</th><th>Error Type</th><th>Severity</th><th>Target Location</th><th>Expected</th><th>Actual</th><th>Description</th><th>Details</th></tr></thead><tbody>${(issues||[]).map((er,idx)=>issueRow(er,idx)).join('')||'<tr><td colspan="8">No issues found.</td></tr>'}</tbody></table></div>`;
 };
 // The QA run already contains the authoritative saved issues. Render them directly first.
 // This avoids losing the report if the browser is connected to a server instance that does not yet expose the optional API route.
 if(initialIssues.length || Number(result.issue_count||0)===0){
   renderIssues(initialIssues);
   return;
 }
 // Fallback for older run payloads that contain only summary counts.
 try{
   const authoritative=await api('/api/file-report/'+encodeURIComponent(result.file_pair_db_id));
   renderIssues(authoritative.issues||[]);
 }catch(e){
   const body=$('fileReportBody');
   if(body)body.innerHTML=`<div class="error">Unable to load the saved QA issues. The QA run contains ${esc(result.issue_count||0)} saved errors, but this server instance did not return their details. Restart the Flask server with the updated server.py and refresh the page.</div>`;
 }
}
async function returnToRun(){if(state.activeRunReturn?.runId)return restoreRun(state.activeRunReturn.runId);showApp();}
function issueRow(er,idx){const id='d'+idx;return `<tr><td>${idx+1}</td><td>${chip(er.category)}</td><td>${chip(er.severity)}</td><td>${esc(er.line||'—')}</td><td class="truncate" title="${esc(er.expected)}">${esc(er.expected||'—')}</td><td class="truncate" title="${esc(er.actual)}">${esc(er.actual||'—')}</td><td>${esc(er.message||'')}</td><td><button class="smallbtn" onclick="const el=document.getElementById('${id}');if(el)el.classList.toggle('hidden')">Show More</button></td></tr><tr id="${id}" class="expand-row hidden"><td colspan="8"><div class="detail-box"><div class="detail-block"><b>Full Expected</b>${esc(er.expected||'—')}</div><div class="detail-block"><b>Full Actual</b>${esc(er.actual||'—')}</div><div class="detail-block"><b>Context / Snippet</b>${esc(er.snippet||'—')}</div></div></td></tr>`}
async function loadMyHistory(){const c=$('content');c.innerHTML=`${userTabs('history')}<div class="card"><h2>My History</h2><p class="hint">Loading...</p></div>`;try{const r=await api('/api/history');c.innerHTML=`${userTabs('history')}<div class="card"><h2>My History</h2>${runsTable(r.runs||[])}</div>`}catch(e){toast(e.message)}}
function runsTable(runs){return `<table><thead><tr><th>Run</th><th>When</th><th>Type</th><th>Status</th><th>Total</th><th>Passed</th><th>Failed</th><th>Actions</th></tr></thead><tbody>${runs.map(r=>`<tr><td>${esc(r.run_id)}</td><td>${esc(r.created_at)}</td><td>${esc(r.source_type)}</td><td>${chip(r.status)}</td><td>${r.total_files}</td><td>${r.passed_files}</td><td>${r.failed_files}</td><td><div class="actions"><button class="linkbtn" onclick="viewRun('${esc(r.run_id)}')">View Files</button><a class="linkbtn" href="/download-batch/${encodeURIComponent(r.run_id)}">Batch Excel</a></div></td></tr>`).join('')||'<tr><td colspan="8">No runs yet.</td></tr>'}</tbody></table>`}
async function viewRun(runId){try{const r=await api('/api/history/'+encodeURIComponent(runId));root.innerHTML=`<div class="app">${topbar()}<main class="main"><button class="secondary" onclick="showApp()">← Back</button><div class="card"><h2>Run Details</h2><p class="hint">${esc(runId)} · Ran by ${esc(r.run.ran_by||r.run.username_snapshot||'')}</p>${fileTable(r.files||[])}</div></main></div>`}catch(e){toast(e.message)}}
function fileTable(files){return `<table><thead><tr><th>No</th><th>Source</th><th>Target</th><th>Status</th><th>Severity</th><th>Errors</th><th>Message</th><th>Report</th></tr></thead><tbody>${files.map(f=>`<tr><td>${f.file_no}</td><td>${esc(f.source_name)}</td><td>${esc(f.target_name||f.html_name)}</td><td>${chip(f.status)}</td><td>${chip(f.file_severity||'—')}</td><td>${f.issue_count||0}</td><td>${esc(f.status_message||f.error_message||'')}</td><td>${f.report_path?`<a class="linkbtn" href="/download-file/${f.id}">Download</a>`:'—'}</td></tr>`).join('')}</tbody></table>`}
function renderAdmin(){root.innerHTML=`<div class="app">${topbar()}<div class="layout"><aside class="sidebar"><div class="side-title">Admin Panel</div>${['dashboard','users','runs','problems','invites','resets','logs'].map(t=>`<button class="side-btn ${state.adminTab===t?'active':''}" onclick="adminTab('${t}')">${({dashboard:'Dashboard',users:'Users',runs:'All Runs',problems:'Failed / Interrupted',invites:'Invites',resets:'Password Resets',logs:'Audit Logs'})[t]}</button>`).join('')}<button class="side-btn" onclick="logout()">Logout</button></aside><main class="main"><div id="adminContent"></div></main></div></div>`;adminTab(state.adminTab||'dashboard')}
async function adminTab(t){state.adminTab=t;document.querySelectorAll('.side-btn').forEach(b=>b.classList.remove('active'));const c=$('adminContent');if(!c)return;try{if(t==='dashboard'){const s=await api('/api/admin/summary');c.innerHTML=`<div class="page-head"><div><h1>Admin Dashboard</h1><p>Monitor users, invites, QA runs, failures, and downloads.</p></div></div><div class="grid">${Object.entries({Users:s.users,Active:s.active_users,Invites:s.pending_invites,'Password Resets':s.pending_resets,Runs:s.runs,Completed:s.completed_runs,Failed:s.failed_runs,Interrupted:s.interrupted_runs,Critical:s.critical_issues}).map(([k,v])=>`<div class="stat"><small>${k}</small><b>${v}</b></div>`).join('')}</div>`}
else if(t==='users'){const r=await api('/api/admin/users');c.innerHTML=`<div class="page-head"><div><h1>Users</h1><p>Company users and access status.</p></div></div><div class="card"><table><thead><tr><th>Username</th><th>Company Email</th><th>Role</th><th>Status</th><th>Last Login</th><th>Runs</th><th>Actions</th></tr></thead><tbody>${r.users.map(u=>`<tr><td>${esc(u.username)}</td><td>${esc(u.email)}</td><td>${chip(u.role)}</td><td>${chip(u.status)}</td><td>${esc(u.last_login_at||'—')}</td><td>${u.total_runs||0}</td><td><div class="actions">${u.role==='admin'?'Fixed Admin':`<button class="smallbtn" onclick="setUserStatus(${u.id},'${u.status==='active'?'disabled':'active'}')">${u.status==='active'?'Disable':'Activate'}</button>`}</div></td></tr>`).join('')}</tbody></table></div>`}
else if(t==='runs'){const r=await api('/api/admin/runs');c.innerHTML=`<div class="page-head"><div><h1>All Runs</h1><p>Every QA batch across all users.</p></div></div><div class="card">${adminRunsTable(r.runs||[])}</div>`}
else if(t==='problems'){const r=await api('/api/admin/problem-runs');c.innerHTML=`<div class="page-head"><div><h1>Failed / Interrupted</h1><p>Runs that did not complete normally.</p></div></div><div class="card">${adminRunsTable(r.runs||[])}</div>`}
else if(t==='invites'){const r=await api('/api/admin/invites');c.innerHTML=`<div class="page-head"><div><h1>Invites</h1><p>Invite users by company email. Copy the generated invite link and send it to them.</p></div></div><div class="card"><h2>Create Invite</h2><div class="upload-grid"><div class="field"><label>Company Email</label><input id="inviteEmail" class="input" placeholder="person@company.com"></div><div class="field"><label>Account Type</label><input class="input" value="Normal User" readonly></div></div><button class="primary" onclick="createInvite()">Create Invite Link</button><div id="inviteOut"></div></div><div class="card"><h2>Invite History</h2><table><thead><tr><th>Email</th><th>Role</th><th>Status</th><th>Expires</th><th>Created</th></tr></thead><tbody>${r.invites.map(i=>`<tr><td>${esc(i.email)}</td><td>${chip(i.role)}</td><td>${chip(i.status)}</td><td>${esc(i.expires_at)}</td><td>${esc(i.created_at)}</td></tr>`).join('')||'<tr><td colspan="5">No invites.</td></tr>'}</tbody></table></div>`}
else if(t==='resets'){await renderAdminResets(c)}
else if(t==='logs'){const r=await api('/api/admin/audit-logs');c.innerHTML=`<div class="page-head"><div><h1>Audit Logs</h1><p>Login, invite, run, and report activity.</p></div></div><div class="card"><table><thead><tr><th>Time</th><th>User</th><th>Email</th><th>Action</th><th>Details</th></tr></thead><tbody>${r.logs.map(l=>`<tr><td>${esc(l.created_at)}</td><td>${esc(l.actor_username||'—')}</td><td>${esc(l.actor_email||'—')}</td><td>${chip(l.action)}</td><td>${esc(l.details||'')}</td></tr>`).join('')}</tbody></table></div>`}}catch(e){c.innerHTML=`<div class="error">${esc(e.message)}</div>`}}
async function renderAdminResets(c){
 const r=await api('/api/admin/password-resets?status=requested');
 const g=await api('/api/admin/password-resets?status=link_generated');
 const pending=r.requests||[],linked=g.requests||[];
 c.innerHTML=`<div class="page-head"><div><h1>Password Resets</h1><p>Users who requested a reset. Generate a link and share it with them through a trusted channel — this portal does not send email.</p></div></div>
 <div class="card"><h2>Pending Requests (${pending.length})</h2><table><thead><tr><th>Username</th><th>Email</th><th>Requested</th><th>Actions</th></tr></thead><tbody>${pending.map(x=>`<tr><td>${esc(x.current_username||x.username_snapshot)}</td><td>${esc(x.current_email||x.email_snapshot)}</td><td>${esc(x.requested_at)}</td><td><div class="actions"><button class="linkbtn" onclick="generateResetLink(${x.id})">Generate Reset Link</button><button class="smallbtn" onclick="cancelResetRequest(${x.id})">Cancel</button></div></td></tr>`).join('')||'<tr><td colspan="4">No pending requests.</td></tr>'}</tbody></table></div>
 <div id="resetLinkOut"></div>
 <div class="card"><h2>Links Awaiting Use (${linked.length})</h2><table><thead><tr><th>Username</th><th>Email</th><th>Link Generated</th><th>Expires</th><th>Actions</th></tr></thead><tbody>${linked.map(x=>`<tr><td>${esc(x.current_username||x.username_snapshot)}</td><td>${esc(x.current_email||x.email_snapshot)}</td><td>${esc(x.link_generated_at)}</td><td>${esc(x.expires_at)}</td><td><button class="smallbtn" onclick="cancelResetRequest(${x.id})">Cancel</button></td></tr>`).join('')||'<tr><td colspan="5">None.</td></tr>'}</tbody></table></div>`;
}
async function generateResetLink(requestId){try{const r=await api(`/api/admin/password-resets/${requestId}/generate-link`,{method:'POST'});$('resetLinkOut').innerHTML=`<div class="card" style="background:#f8fafc"><b>Reset Link</b><p class="hint">Copy this and share it with the user through a trusted channel. It expires ${esc(r.reset.expires_at)}.</p><input class="input" value="${esc(r.reset.reset_url)}" onclick="this.select()"></div>`;adminTab('resets')}catch(e){toast(e.message)}}
async function cancelResetRequest(requestId){try{await api(`/api/admin/password-resets/${requestId}/cancel`,{method:'POST'});adminTab('resets')}catch(e){toast(e.message)}}
function adminRunsTable(runs){return `<table><thead><tr><th>Run</th><th>Ran By</th><th>Email</th><th>When</th><th>Type</th><th>Status</th><th>Total</th><th>Passed</th><th>Failed</th><th>Actions</th></tr></thead><tbody>${runs.map(r=>`<tr><td>${esc(r.run_id)}</td><td>${esc(r.ran_by||r.username_snapshot||'')}</td><td>${esc(r.ran_by_email||r.email_snapshot||'')}</td><td>${esc(r.created_at)}</td><td>${esc(r.source_type)}</td><td>${chip(r.status)}</td><td>${r.total_files}</td><td>${r.passed_files}</td><td>${r.failed_files}</td><td><div class="actions"><button class="linkbtn" onclick="viewRun('${esc(r.run_id)}')">View Files</button><a class="linkbtn" href="/download-batch/${encodeURIComponent(r.run_id)}">Excel</a></div></td></tr>`).join('')||'<tr><td colspan="10">No runs.</td></tr>'}</tbody></table>`}
async function setUserStatus(id,status){try{await api(`/api/admin/users/${id}/status`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});adminTab('users')}catch(e){toast(e.message)}}
async function setUserRole(id,role){try{await api(`/api/admin/users/${id}/role`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role})});adminTab('users')}catch(e){toast(e.message)}}
async function createInvite(){try{const r=await api('/api/admin/invites',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('inviteEmail').value})});$('inviteOut').innerHTML=`<div class="card" style="background:#f8fafc"><b>Invite Link</b><p class="hint">Copy this and send it to the user.</p><input class="input" value="${esc(r.invite.invite_url)}" onclick="this.select()"></div>`}catch(e){toast(e.message)}}
boot();
</script>
</body>
</html>
